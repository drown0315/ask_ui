name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint web
        run: npm run lint

      - name: Type-check web
        run: npm run typecheck

      - name: Test web
        run: npm test

  dart:
    name: Dart checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bridge

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dart dependencies
        run: dart pub get

      - name: Analyze Dart
        run: dart analyze

      - name: Test Dart
        run: dart test
