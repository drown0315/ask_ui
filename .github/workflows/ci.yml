name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint web
        run: npm run lint

      - name: Type-check web
        run: npm run typecheck

      - name: Test web
        run: npm test

  dart:
    name: Dart checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bridge

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dart dependencies
        run: dart pub get

      - name: Analyze Dart
        run: dart analyze

      - name: Test Dart
        run: dart test

  bridge-release:
    name: Bridge release package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --legacy-peer-deps

      - name: Build packaged Web workbench
        working-directory: apps/web
        run: npm run build:bridge

      - name: Install bridge dependencies
        working-directory: apps/bridge
        run: dart pub get

      - name: Test bridge release helpers
        working-directory: apps/bridge
        run: dart test test/release

      - name: Validate bridge package layout
        working-directory: apps/bridge
        run: dart tool/validate_release_layout.dart

      - name: Validate pub package dry run
        working-directory: apps/bridge
        run: dart pub publish --dry-run
