<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ask UI scrcpy WebCodecs Calibration</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #101418;
        color: #edf2f7;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      header,
      footer {
        padding: 12px 16px;
        border-color: #2a333d;
        background: #151b21;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid #2a333d;
      }

      footer {
        border-top: 1px solid #2a333d;
      }

      button {
        border: 1px solid #475463;
        border-radius: 6px;
        background: #d7ff64;
        color: #12170f;
        font-weight: 700;
        padding: 8px 12px;
        cursor: pointer;
      }

      button:disabled {
        cursor: default;
        opacity: 0.55;
      }

      main {
        display: grid;
        place-items: center;
        min-height: 0;
        padding: 18px;
      }

      .surface {
        display: grid;
        place-items: center;
        width: min(100%, 520px);
        height: 100%;
        min-height: 0;
      }

      canvas {
        max-width: 100%;
        max-height: calc(100vh - 170px);
        width: auto;
        height: auto;
        background: #050607;
        border: 1px solid #394553;
        box-shadow: 0 20px 80px rgb(0 0 0 / 0.35);
        cursor: crosshair;
        touch-action: none;
        user-select: none;
      }

      .status {
        color: #a7b3c2;
        font-size: 13px;
        line-height: 1.4;
      }

      pre {
        max-height: 130px;
        overflow: auto;
        margin: 0;
        white-space: pre-wrap;
        color: #cbd5e1;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <button id="start">Start WebCodecs stream</button>
      <div class="status" id="status">Idle</div>
    </header>
    <main>
      <div class="surface">
        <canvas id="screen" width="486" height="1080"></canvas>
      </div>
    </main>
    <footer>
      <pre id="log"></pre>
    </footer>
    <script>
      const startButton = document.getElementById('start');
      const statusEl = document.getElementById('status');
      const logEl = document.getElementById('log');
      const canvas = document.getElementById('screen');
      const context = canvas.getContext('2d');

      const LOW_LATENCY_QUEUE_LIMIT = 1;
      const HARD_QUEUE_LIMIT = 3;
      const NOMINAL_FRAME_DURATION_US = 16667;

      let decoder = null;
      let socket = null;
      let displaySize = null;
      let pendingBytes = new Uint8Array();
      let currentAccessUnit = [];
      let currentAccessUnitHasVcl = false;
      let sps = null;
      let pps = null;
      let configuredCodec = '';
      let frameIndex = 0;
      let decodedFrames = 0;
      let droppedChunks = 0;
      let inputChunks = 0;
      let inputBytes = 0;
      let decodedSinceLastTick = 0;
      let droppedSinceLastTick = 0;
      let lastStatsAt = performance.now();
      let lastServerLogAt = 0;
      let suppressedServerLogs = 0;
      let statsTimer = null;
      let pointerStart = null;
      let lastMoveSentAt = 0;

      function log(message) {
        const time = new Date().toLocaleTimeString();
        logEl.textContent = `[${time}] ${message}\n${logEl.textContent}`;
      }

      function setStatus(message) {
        statusEl.textContent = message;
      }

      function resetStreamState() {
        if (decoder && decoder.state !== 'closed') {
          decoder.close();
        }
        decoder = null;
        socket = null;
        pendingBytes = new Uint8Array();
        currentAccessUnit = [];
        currentAccessUnitHasVcl = false;
        sps = null;
        pps = null;
        configuredCodec = '';
        frameIndex = 0;
        decodedFrames = 0;
        droppedChunks = 0;
        inputChunks = 0;
        inputBytes = 0;
        decodedSinceLastTick = 0;
        droppedSinceLastTick = 0;
        lastStatsAt = performance.now();
        lastServerLogAt = 0;
        suppressedServerLogs = 0;
      }

      function startStatsTimer() {
        if (statsTimer) {
          clearInterval(statsTimer);
        }
        statsTimer = setInterval(() => {
          const now = performance.now();
          const seconds = Math.max(0.001, (now - lastStatsAt) / 1000);
          const fps = decodedSinceLastTick / seconds;
          const dropRate = droppedSinceLastTick / seconds;
          const queue = decoder?.decodeQueueSize ?? 0;
          setStatus(
            `decoded=${decodedFrames} fps=${fps.toFixed(1)} dropped=${droppedChunks} drop/s=${dropRate.toFixed(
              1,
            )} queue=${queue} input=${(inputBytes / 1024 / 1024).toFixed(1)}MiB`,
          );
          decodedSinceLastTick = 0;
          droppedSinceLastTick = 0;
          lastStatsAt = now;
        }, 500);
      }

      function stopStatsTimer() {
        if (statsTimer) {
          clearInterval(statsTimer);
          statsTimer = null;
        }
      }

      function logServerMessage(message) {
        const now = performance.now();
        if (now - lastServerLogAt < 1000) {
          suppressedServerLogs += 1;
          return;
        }
        const suffix = suppressedServerLogs ? ` (${suppressedServerLogs} logs suppressed)` : '';
        suppressedServerLogs = 0;
        lastServerLogAt = now;
        log(`${message}${suffix}`);
      }

      async function requestJson(url, options) {
        const response = await fetch(url, options);
        const text = await response.text();
        const body = text ? JSON.parse(text) : {};
        if (!response.ok) {
          throw new Error(body.error || response.statusText);
        }
        return body;
      }

      function eventToStreamPoint(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: Math.round(((event.clientX - rect.left) / rect.width) * canvas.width),
          y: Math.round(((event.clientY - rect.top) / rect.height) * canvas.height),
          screenWidth: canvas.width,
          screenHeight: canvas.height,
        };
      }

      function sendTouch(action, event) {
        if (!socket || socket.readyState !== WebSocket.OPEN) {
          return;
        }

        socket.send(
          JSON.stringify({
            type: 'touch',
            action,
            pointerId: event.pointerId,
            ...eventToStreamPoint(event),
          }),
        );
      }

      function concatBytes(parts) {
        const total = parts.reduce((sum, part) => sum + part.byteLength, 0);
        const output = new Uint8Array(total);
        let offset = 0;
        for (const part of parts) {
          output.set(part, offset);
          offset += part.byteLength;
        }
        return output;
      }

      function findStartCodes(bytes) {
        const offsets = [];
        for (let index = 0; index < bytes.length - 3; index += 1) {
          if (bytes[index] === 0 && bytes[index + 1] === 0) {
            if (bytes[index + 2] === 1) {
              offsets.push({ offset: index, length: 3 });
              index += 2;
            } else if (bytes[index + 2] === 0 && bytes[index + 3] === 1) {
              offsets.push({ offset: index, length: 4 });
              index += 3;
            }
          }
        }
        return offsets;
      }

      function splitCompleteNals(chunk) {
        pendingBytes = concatBytes([pendingBytes, chunk]);
        const startCodes = findStartCodes(pendingBytes);

        if (startCodes.length < 2) {
          return [];
        }

        const nals = [];
        for (let index = 0; index < startCodes.length - 1; index += 1) {
          nals.push(pendingBytes.slice(startCodes[index].offset, startCodes[index + 1].offset));
        }
        pendingBytes = pendingBytes.slice(startCodes[startCodes.length - 1].offset);
        return nals;
      }

      function nalPayloadOffset(nal) {
        if (nal[0] === 0 && nal[1] === 0 && nal[2] === 1) {
          return 3;
        }
        return 4;
      }

      function nalType(nal) {
        return nal[nalPayloadOffset(nal)] & 0x1f;
      }

      function codecFromSps(nal) {
        const offset = nalPayloadOffset(nal);
        const profile = nal[offset + 1].toString(16).padStart(2, '0').toUpperCase();
        const constraints = nal[offset + 2].toString(16).padStart(2, '0').toUpperCase();
        const level = nal[offset + 3].toString(16).padStart(2, '0').toUpperCase();
        return `avc1.${profile}${constraints}${level}`;
      }

      async function configureDecoder(codec) {
        if (configuredCodec === codec && decoder?.state === 'configured') {
          return;
        }

        if (decoder) {
          decoder.close();
        }

        const support = await VideoDecoder.isConfigSupported({
          codec,
          optimizeForLatency: true,
        });

        if (!support.supported) {
          throw new Error(`VideoDecoder does not support ${codec}`);
        }

        decoder = new VideoDecoder({
          output(frame) {
            if (canvas.width !== frame.displayWidth || canvas.height !== frame.displayHeight) {
              canvas.width = frame.displayWidth;
              canvas.height = frame.displayHeight;
            }
            context.drawImage(frame, 0, 0, canvas.width, canvas.height);
            frame.close();
            decodedFrames += 1;
            decodedSinceLastTick += 1;
          },
          error(error) {
            log(`decoder error: ${error.message}`);
          },
        });
        decoder.configure({ codec, optimizeForLatency: true });
        configuredCodec = codec;
        log(`decoder configured: ${codec}`);
      }

      function isVclType(type) {
        return type === 1 || type === 5;
      }

      function flushAccessUnit(forceType) {
        if (!currentAccessUnit.length || !decoder || decoder.state !== 'configured') {
          currentAccessUnit = [];
          currentAccessUnitHasVcl = false;
          return;
        }

        const hasIdr = currentAccessUnit.some((nal) => nalType(nal) === 5);
        if (!hasIdr && frameIndex === 0) {
          currentAccessUnit = [];
          currentAccessUnitHasVcl = false;
          return;
        }

        const queueSize = decoder.decodeQueueSize;
        const shouldDropDelta = !hasIdr && queueSize > LOW_LATENCY_QUEUE_LIMIT;
        const shouldDropAny = queueSize > HARD_QUEUE_LIMIT;
        if (shouldDropDelta || shouldDropAny) {
          droppedChunks += 1;
          droppedSinceLastTick += 1;
          currentAccessUnit = [];
          currentAccessUnitHasVcl = false;
          return;
        }

        const data = concatBytes(currentAccessUnit);
        decoder.decode(
          new EncodedVideoChunk({
            type: forceType || (hasIdr ? 'key' : 'delta'),
            timestamp: frameIndex * NOMINAL_FRAME_DURATION_US,
            duration: NOMINAL_FRAME_DURATION_US,
            data,
          }),
        );
        frameIndex += 1;
        currentAccessUnit = [];
        currentAccessUnitHasVcl = false;
      }

      async function handleNal(nal) {
        const type = nalType(nal);

        if (type === 7) {
          sps = nal;
          await configureDecoder(codecFromSps(nal));
          return;
        }

        if (type === 8) {
          pps = nal;
          return;
        }

        if (isVclType(type)) {
          if (currentAccessUnitHasVcl) {
            flushAccessUnit();
          }

          if (type === 5 && sps && pps) {
            currentAccessUnit.push(sps, pps);
          }
          currentAccessUnit.push(nal);
          currentAccessUnitHasVcl = true;
          return;
        }

        if (currentAccessUnit.length) {
          currentAccessUnit.push(nal);
        }
      }

      async function handleVideoChunk(buffer) {
        inputChunks += 1;
        inputBytes += buffer.byteLength;
        const nals = splitCompleteNals(new Uint8Array(buffer));
        for (const nal of nals) {
          await handleNal(nal);
        }
      }

      async function start() {
        if (!('VideoDecoder' in window) || !('EncodedVideoChunk' in window)) {
          throw new Error('WebCodecs VideoDecoder is not available in this browser/context');
        }

        resetStreamState();
        startStatsTimer();
        const body = await requestJson('/api/start', { method: 'POST' });
        displaySize = body.displaySize;
        canvas.width = Math.round(displaySize.width / 2);
        canvas.height = Math.round(displaySize.height / 2);

        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        socket = new WebSocket(`${protocol}//${location.host}/raw-h264`);
        socket.binaryType = 'arraybuffer';

        socket.addEventListener('open', () => {
          setStatus(`Connecting ${body.deviceId} ${displaySize.width}x${displaySize.height}`);
        });
        socket.addEventListener('message', async (event) => {
          if (typeof event.data === 'string') {
            const message = JSON.parse(event.data);
            if (message.type === 'ready') {
              log(JSON.stringify(message, null, 2));
            } else if (message.type === 'server-log') {
              logServerMessage(message.message);
            } else if (message.type === 'control-connected') {
              log('scrcpy control socket connected');
            } else if (message.type === 'control-error') {
              log(`control error: ${message.message}`);
            } else if (message.type === 'error') {
              log(`stream error: ${message.message}`);
            } else {
              log(JSON.stringify(message));
            }
            return;
          }

          try {
            await handleVideoChunk(event.data);
          } catch (error) {
            log(`video chunk failed: ${error.message}`);
          }
        });
        socket.addEventListener('close', () => {
          stopStatsTimer();
          setStatus(`Closed. decoded=${decodedFrames}, dropped=${droppedChunks}`);
          startButton.disabled = false;
          flushAccessUnit();
        });
        socket.addEventListener('error', () => {
          log('websocket error');
        });
      }

      startButton.addEventListener('click', async () => {
        startButton.disabled = true;
        setStatus('Starting...');
        try {
          await start();
        } catch (error) {
          stopStatsTimer();
          startButton.disabled = false;
          setStatus('Failed');
          log(error.message);
        }
      });

      canvas.addEventListener('pointerdown', (event) => {
        if (!displaySize) {
          return;
        }

        event.preventDefault();
        canvas.setPointerCapture(event.pointerId);
        pointerStart = {
          pointerId: event.pointerId,
        };
        sendTouch(0, event);
      });

      canvas.addEventListener('pointermove', (event) => {
        if (!displaySize || !pointerStart || pointerStart.pointerId !== event.pointerId) {
          return;
        }

        event.preventDefault();
        const now = performance.now();
        if (now - lastMoveSentAt < 16) {
          return;
        }
        lastMoveSentAt = now;
        sendTouch(2, event);
      });

      canvas.addEventListener('pointerup', (event) => {
        if (!displaySize || !pointerStart || pointerStart.pointerId !== event.pointerId) {
          return;
        }

        event.preventDefault();
        pointerStart = null;
        sendTouch(1, event);
      });

      canvas.addEventListener('pointercancel', (event) => {
        if (pointerStart && pointerStart.pointerId === event.pointerId) {
          sendTouch(1, event);
        }
        pointerStart = null;
      });
    </script>
  </body>
</html>
